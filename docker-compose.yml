services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "6333:6333"

  int:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    # QDRANT_URL defaults to http://qdrant:6333 inside the compose network.

volumes:
  qdrant-data:
