[project]
name = "int"
version = "0.1.0"
description = "Self-hosted, Dockerized, open-source AI memory system — a local-first alternative to Supermemory."
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.0",
    "qdrant-client>=1.12",
    "google-genai>=0.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "numpy>=1.26",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
int-cli = "int_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "testcontainers>=4.7",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["int", "int_cli"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["int", "int_cli"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "google.genai.*", "mcp.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=int --cov-report=term-missing --cov-fail-under=80"
markers = [
    "live: opt-in tests that hit the real Gemini API (skipped by default; run with --run-live)",
]

[tool.coverage.run]
source = ["int"]
omit = ["tests/*", "int_cli/*"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
]
